services:
  postgres:
    image: postgres:16-alpine
    container_name: bybusca-postgres
    environment:
      POSTGRES_DB: bybusca
      POSTGRES_USER: bybusca
      POSTGRES_PASSWORD: bybusca
    ports:
      - "5432:5432"
    volumes:
      - bybusca_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bybusca -d bybusca"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bybusca_pg:
